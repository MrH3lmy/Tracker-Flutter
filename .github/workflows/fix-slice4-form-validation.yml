name: Fix Slice 4 Form Validation

on:
  push:
    branches:
      - epic4-slice4-task-write

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epic4-slice4-task-write
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Keep form fields mounted and initialize auth in test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          form = Path('lib/features/tasks/presentation/task_form_screen.dart')
          text = form.read_text()
          old = """      child: ListView(\n        padding: const EdgeInsets.all(AppSpacing.md),\n        children: [\n"""
          new = """      child: SingleChildScrollView(\n        padding: const EdgeInsets.all(AppSpacing.md),\n        child: Column(\n          children: [\n"""
          if old not in text:
              raise SystemExit('task form opening pattern not found')
          text = text.replace(old, new, 1)
          old_close = """          const SizedBox(height: AppSpacing.xl),\n        ],\n      ),\n    );\n  }\n}\n\nenum _DateField"""
          new_close = """          const SizedBox(height: AppSpacing.xl),\n          ],\n        ),\n      ),\n    );\n  }\n}\n\nenum _DateField"""
          if old_close not in text:
              raise SystemExit('task form closing pattern not found')
          form.write_text(text.replace(old_close, new_close, 1))

          test = Path('test/features/tasks/presentation/task_form_screen_test.dart')
          text = test.read_text()
          import_line = "import 'package:tracker_flutter/features/auth/data/auth_repository.dart';\n"
          anchor = "import 'package:tracker_flutter/features/auth/data/auth_result.dart';\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('auth import anchor not found')
              text = text.replace(anchor, import_line + anchor, 1)
          old_tail = """    );\n    await tester.pumpAndSettle();\n  }\n\n  Future<void> scrollToSubmit(WidgetTester tester) => tester.dragUntilVisible(\n    find.widgetWithText(FilledButton, 'Create task'),\n    find.byType(ListView),\n"""
          new_tail = """    );\n    final container = ProviderScope.containerOf(\n      tester.element(find.byType(TaskCreateScreen)),\n    );\n    await container.read(authRepositoryProvider.notifier).startupRestoration;\n    await tester.pumpAndSettle();\n  }\n\n  Future<void> scrollToSubmit(WidgetTester tester) => tester.dragUntilVisible(\n    find.widgetWithText(FilledButton, 'Create task'),\n    find.byType(SingleChildScrollView),\n"""
          if old_tail not in text:
              raise SystemExit('task form test pattern not found')
          test.write_text(text.replace(old_tail, new_tail, 1))
          PY
      - run: dart format lib test integration_test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/tasks/presentation/task_form_screen.dart test/features/tasks/presentation/task_form_screen_test.dart
          git commit -m "fix(tasks): keep form validators mounted and await auth in tests"
          git push origin HEAD:epic4-slice4-task-write
