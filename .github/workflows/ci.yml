name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify formatting
        run: |
          flutter pub get
          dart format lib test integration_test
          git diff -- test/core/network/api_client_test.dart
          exit 1

  build-android:
    name: Build Android (debug)
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped

  build-web:
    name: Build Web
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - run: echo skipped
