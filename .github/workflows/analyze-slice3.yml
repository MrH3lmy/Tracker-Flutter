name: Analyze Slice 3

on:
  push:
    branches:
      - epic4-slice3-tasks

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epic4-slice3-tasks
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Capture analyzer output
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze-slice3-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            rm -f analyze-slice3-output.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyze-slice3-output.txt
          git commit -m "chore: capture slice 3 analyzer diagnostics"
          git push origin HEAD:epic4-slice3-tasks
          exit "$status"
