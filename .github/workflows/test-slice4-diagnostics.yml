name: Test Slice 4 Diagnostics

on:
  push:
    branches:
      - epic4-slice4-task-write

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: epic4-slice4-task-write
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Capture tests
        shell: bash
        run: |
          set +e
          flutter test --coverage 2>&1 | tee test-slice4-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            rm -f test-slice4-output.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-slice4-output.txt
          git commit -m "chore: capture slice 4 test diagnostics"
          git push origin HEAD:epic4-slice4-task-write
          exit "$status"
