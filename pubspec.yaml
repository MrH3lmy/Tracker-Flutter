name: tracker_flutter
description: "Tracker Flutter — cross-platform client for Tracker-BE"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / dependency injection
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.4.0

  # Networking (client foundation only — the full interceptor/auth/pagination
  # stack is built out under the networking-layer epic)
  dio: ^5.11.0

  # OS-backed secure storage for native refresh credentials (Keychain /
  # Keystore / Credential Manager / Secret Service) — never used on Web,
  # which has no persisted refresh credential to store (see AuthRepository).
  flutter_secure_storage: ^11.0.0

  # Immutable models / API DTOs
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Connectivity detection
  connectivity_plus: ^7.3.1

  # Localization readiness
  intl: ^0.20.3

  # Structured, redactable logging
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod: ^3.4.2

flutter:
  uses-material-design: true
